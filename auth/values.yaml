microservices:
  - name: auth
    image:
      repository: mohamedaziz599/auth
      tag: 123
    port: 3000
    env:
      - name: JWT_KEY
        valueFrom:
          secretKeyRef:
            name: jwt-secret
            key: jwt_key
      - name: MONGO_URI
        value: mongodb://mongodb:27017/auth
      - name: RABBITMQ_URL
        valueFrom:
          secretKeyRef:
            name: rabbitmq-secret
            key: rabbitmq_url

  - name: client
    image:
      repository: mohamedaziz599/client
      tag: 123
    port: 3000
    env:
      - name: HOST
        value: "0.0.0.0"
      - name: JWT_KEY
        valueFrom:
          secretKeyRef:
            name: jwt-secret
            key: jwt_key
      - name: MONGO_URI
        value: mongodb://mongodb:27017/client

