apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodeapp-ingress
spec:
  ingressClassName: nginx

  rules:
    - host: nodeapp.local
      http:
        paths:

          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 3000

          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  number: 3002

          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payments
                port:
                  number: 3003

          - path: /api/tickets
            pathType: Prefix
            backend:
              service:
                name: tickets
                port:
                  number: 3004

          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 3000
